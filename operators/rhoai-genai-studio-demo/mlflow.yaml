# Cluster-scoped MLflow singleton. Workspace selector scopes UI/API to the
# GenAI Studio demo namespace. Tracing setup script is idempotent if this
# already exists.
apiVersion: mlflow.opendatahub.io/v1
kind: MLflow
metadata:
  name: mlflow
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  backendStoreUri: "sqlite:////mlflow/mlflow.db"
  serveArtifacts: true
  artifactsDestination: "file:///mlflow/artifacts"
  storage:
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 5Gi
  workspaceLabelSelector:
    matchLabels:
      kubernetes.io/metadata.name: demo
