apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Enable MLflow for GenAI Studio playground tracing (rhoai-demo-guide pattern).
patches:
  - target:
      group: datasciencecluster.opendatahub.io
      kind: DataScienceCluster
      name: default-dsc
    patch: |-
      - op: replace
        path: /spec/components/mlflowoperator/managementState
        value: Managed
