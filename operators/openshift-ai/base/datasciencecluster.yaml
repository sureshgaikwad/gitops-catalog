apiVersion: datasciencecluster.opendatahub.io/v2
kind: DataScienceCluster
metadata:
  name: default-dsc
  labels:
    app.kubernetes.io/name: datasciencecluster
    app.kubernetes.io/instance: default-dsc
    app.kubernetes.io/part-of: rhods-operator
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/created-by: rhods-operator
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  components:
    dashboard:
      managementState: Managed
    aipipelines:
      managementState: Managed
    kserve:
      managementState: Managed
      rawDeploymentServiceConfig: Headless
      nim:
        managementState: Managed
    # AI Gateway is Managed at install; Models-as-a-Service stays Removed until
    # RHCL + maas-default-gateway are ready (enable via components/maas-enable).
    aigateway:
      managementState: Managed
      modelsAsAService:
        managementState: Removed
    modelregistry:
      managementState: Managed
      registriesNamespace: rhoai-model-registries
    feastoperator:
      managementState: Removed
    trustyai:
      managementState: Managed
    ray:
      managementState: Managed
    kueue:
      managementState: Unmanaged
    workbenches:
      managementState: Managed
      workbenchNamespace: rhods-notebooks
    # Gen AI backend is mutually exclusive: enable exactly one of
    # components/genai-ogx or components/llamastack via Argo/TF.
    llamastackoperator:
      managementState: Removed
    ogx:
      managementState: Removed
    trainingoperator:
      managementState: Managed
    trainer:
      managementState: Managed
