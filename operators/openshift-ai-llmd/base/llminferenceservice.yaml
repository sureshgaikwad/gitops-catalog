apiVersion: serving.kserve.io/v1alpha1
kind: LLMInferenceService
metadata:
  name: qwen25-05b-llmd
  namespace: rhoai-deploy
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
  labels:
    app.kubernetes.io/part-of: llm-d
    opendatahub.io/dashboard: "true"
spec:
  model:
    uri: "oci://quay.io/redhat-ai-services/modelcar-catalog:qwen2.5-0.5b-instruct"
    name: qwen25-05b-llmd
  # replicas intentionally omitted so KEDA can own the Deployment replica count.
  router:
    scheduler: {}
    route: {}
    gateway:
      refs:
        - name: maas-default-gateway
          namespace: openshift-ingress
  template:
    containers:
      - name: main
        image: registry.redhat.io/rhaii/vllm-cpu-rhel9@sha256:7a28b867955055a8836ea2a78e70b8bad63c1ee50e8a5f8dd95d1194f20ec489
        args:
          - "--dtype=bfloat16"
          - "--max-model-len=4096"
          - "--max-num-seqs=4"
          - "--enable-force-include-usage"
          - "--enforce-eager"
          # Required for playground Knowledge / PDF (tool_choice=auto → file_search)
          - "--enable-auto-tool-choice"
          - "--tool-call-parser=hermes"
        env:
          - name: VLLM_CPU_KVCACHE_SPACE
            value: "2"
          - name: OMP_NUM_THREADS
            value: "2"
          - name: VLLM_CPU_OMP_THREADS_BIND
            value: "0-1"
          - name: LD_PRELOAD
            value: "/usr/lib64/libomp.so"
        resources:
          requests:
            cpu: "500m"
            memory: 2Gi
          limits:
            cpu: "2"
            memory: 4Gi
