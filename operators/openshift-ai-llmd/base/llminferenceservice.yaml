apiVersion: serving.kserve.io/v1alpha1
kind: LLMInferenceService
metadata:
  name: qwen25-05b-llmd
  namespace: rhoai-deploy
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
  labels:
    app.kubernetes.io/part-of: llm-d
    opendatahub.io/dashboard: "true"
spec:
  model:
    uri: "oci://quay.io/redhat-ai-services/modelcar-catalog:qwen2.5-0.5b-instruct"
    name: qwen25-05b-llmd
  # replicas intentionally omitted so KEDA can own the Deployment replica count.
  router:
    scheduler: {}
    route: {}
    gateway:
      refs:
        - name: maas-default-gateway
          namespace: openshift-ingress
  template:
    containers:
      - name: main
        image: registry.redhat.io/rhaii/vllm-cpu-rhel9@sha256:7a28b867955055a8836ea2a78e70b8bad63c1ee50e8a5f8dd95d1194f20ec489
        command:
          - /bin/bash
          - -c
          - |
            set -euo pipefail
            if [ -f /etc/profile.d/ibm-aiu-setup.sh ]; then
              # shellcheck disable=SC1091
              source /etc/profile.d/ibm-aiu-setup.sh
            fi
            MODEL_SRC=/mnt/models
            MODEL_LOCAL=/home/vllm/local-model
            mkdir -p /home/vllm/hf-cache
            export HF_HUB_CACHE=/home/vllm/hf-cache
            export TRANSFORMERS_CACHE=/home/vllm/hf-cache
            export HF_HOME=/home/vllm/hf-cache
            export HF_HUB_OFFLINE=1
            export TRANSFORMERS_OFFLINE=1
            for i in $(seq 1 120); do
              [ -f "${MODEL_SRC}/config.json" ] && break
              sleep 2
            done
            test -f "${MODEL_SRC}/config.json"
            rm -rf "$MODEL_LOCAL"
            mkdir -p "$MODEL_LOCAL"
            cp -a "${MODEL_SRC}/." "$MODEL_LOCAL/"
            ACCESS_LOG_ARGS="--disable-uvicorn-access-log"
            VLLM_VERSION=$(vllm --version 2>/dev/null | tail -1 | awk '{print $NF}')
            if [[ "$VLLM_VERSION" =~ ^[0-9]+\.[0-9]+ ]] && [ "$(printf '%s\n%s\n' "0.16.0" "${VLLM_VERSION}" | sort -V | head -1)" = "0.16.0" ]; then
              ACCESS_LOG_ARGS="--disable-access-log-for-endpoints /health,/metrics,/ping"
            fi
            eval "exec vllm serve ${MODEL_LOCAL} \
              --served-model-name \"qwen25-05b-llmd\" \"publishers/rhoai-deploy/models/qwen25-05b-llmd\" \
              --port 8000 \
              ${ACCESS_LOG_ARGS} \
              --enable-ssl-refresh \
              --ssl-certfile /var/run/kserve/tls/tls.crt \
              --ssl-keyfile /var/run/kserve/tls/tls.key \
              --chat-template /opt/app-root/template/tool_chat_template_hermes.jinja \
              ${VLLM_ADDITIONAL_ARGS:-} \
              \"$@\""
          - "--"
        args:
          - "--dtype=bfloat16"
          - "--max-model-len=4096"
          - "--max-num-seqs=4"
          - "--enable-force-include-usage"
          - "--enforce-eager"
          - "--enable-auto-tool-choice"
          - "--tool-call-parser=hermes"
        env:
          - name: VLLM_CPU_KVCACHE_SPACE
            value: "2"
          - name: OMP_NUM_THREADS
            value: "2"
          - name: VLLM_CPU_OMP_THREADS_BIND
            value: "0-1"
          - name: LD_PRELOAD
            value: "/usr/lib64/libomp.so"
          - name: HF_HUB_CACHE
            value: /home/vllm/hf-cache
          - name: HF_HUB_OFFLINE
            value: "1"
          - name: TRANSFORMERS_OFFLINE
            value: "1"
        resources:
          requests:
            cpu: "500m"
            memory: 3Gi
          limits:
            cpu: "2"
            memory: 7Gi
        startupProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTPS
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 120
          successThreshold: 1
