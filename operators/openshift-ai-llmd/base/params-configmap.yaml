apiVersion: v1
kind: ConfigMap
metadata:
  name: rhoai-llmd-params
  namespace: rhoai-deploy
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  modelName: "qwen25-05b-llmd"
  modelNamespace: "rhoai-deploy"
  modelDisplayName: "qwen25-05b-llmd"
  modelOciUri: "oci://quay.io/redhat-ai-services/modelcar-catalog:qwen2.5-0.5b-instruct"
  vllmImage: "registry.redhat.io/rhaii/vllm-cpu-rhel9@sha256:7a28b867955055a8836ea2a78e70b8bad63c1ee50e8a5f8dd95d1194f20ec489"
  gatewayName: "maas-default-gateway"
  gatewayNamespace: "openshift-ingress"
  maasSubscriptionNamespace: "models-as-a-service"
  ownerGroup: "system:authenticated:oauth"
  tokenRateLimit: "5000000"
  tokenRateWindow: "1m"
  cpuRequest: "500m"
  cpuLimit: "2"
  memoryRequest: "2Gi"
  memoryLimit: "4Gi"
  maxModelLen: "4096"
  ompNumThreads: "2"
  # Default idle so the MaaS sample model can reclaim CPU on small worker pools.
  kedaMinReplicas: "0"
  kedaMaxReplicas: "2"
  kedaThreshold: "5"
  kedaPollingInterval: "15"
  kedaCooldownPeriod: "60"
  thanosAddress: "https://thanos-querier.openshift-monitoring.svc.cluster.local:9091"
