# Copies the KServe workload self-signed CA into openshift-lightspeed so OLS
# can call the in-cluster HTTPS model endpoint (additionalCAConfigMapRef).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ols-model-ca-sync
  namespace: openshift-lightspeed
  annotations:
    argocd.argoproj.io/sync-wave: "1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ols-model-ca-sync
  namespace: rhoai-deploy
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    # Prefer MaaS sample; allow llm-d fallback while sample model catches up.
    resourceNames:
      - qwen25-05b-maas-kserve-self-signed-certs
      - qwen25-05b-llmd-kserve-self-signed-certs
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ols-model-ca-sync
  namespace: openshift-lightspeed
  annotations:
    argocd.argoproj.io/sync-wave: "1"
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["maas-model-ca"]
    verbs: ["get", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ols-model-ca-sync-read
  namespace: rhoai-deploy
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ols-model-ca-sync
subjects:
  - kind: ServiceAccount
    name: ols-model-ca-sync
    namespace: openshift-lightspeed
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ols-model-ca-sync-write
  namespace: openshift-lightspeed
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ols-model-ca-sync
subjects:
  - kind: ServiceAccount
    name: ols-model-ca-sync
    namespace: openshift-lightspeed
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ols-model-ca-sync
  namespace: openshift-lightspeed
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 6
  template:
    spec:
      serviceAccountName: ols-model-ca-sync
      restartPolicy: OnFailure
      containers:
        - name: sync
          # Pullable on every OCP/ROSA (ose-cli:latest is often denied)
          image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              # Prefer MaaS sample TLS secret (matches OLSConfig URL); fall back to
              # any *-kserve-self-signed-certs in rhoai-deploy (e.g. llm-d).
              SECRET=""
              for i in $(seq 1 90); do
                for candidate in \
                  qwen25-05b-maas-kserve-self-signed-certs \
                  qwen25-05b-llmd-kserve-self-signed-certs; do
                  if oc get secret "$candidate" -n rhoai-deploy >/dev/null 2>&1; then
                    SECRET="$candidate"
                    break 2
                  fi
                done
                FOUND="$(oc get secrets -n rhoai-deploy -o name 2>/dev/null \
                  | grep -E 'kserve-self-signed-certs$' | head -1 | cut -d/ -f2 || true)"
                if [ -n "${FOUND}" ]; then
                  SECRET="${FOUND}"
                  break
                fi
                echo "waiting for model TLS secret in rhoai-deploy..."
                sleep 10
              done
              if [ -z "${SECRET}" ]; then
                echo "ERROR: no *-kserve-self-signed-certs secret found in rhoai-deploy" >&2
                exit 1
              fi
              echo "using TLS secret: ${SECRET}"
              oc get secret "${SECRET}" -n rhoai-deploy \
                -o jsonpath='{.data.ca\.crt}' | base64 -d > /tmp/ca.crt
              oc create configmap maas-model-ca -n openshift-lightspeed \
                --from-file=ca-bundle.crt=/tmp/ca.crt \
                --dry-run=client -o yaml | oc apply -f -
              echo "synced maas-model-ca from ${SECRET}"
