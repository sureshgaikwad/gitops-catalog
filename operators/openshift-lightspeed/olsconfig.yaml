apiVersion: ols.openshift.io/v1alpha1
kind: OLSConfig
metadata:
  name: cluster
  namespace: openshift-lightspeed
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,Validate=false
  labels:
    app.kubernetes.io/component: ai-assistant
    app.kubernetes.io/instance: openshift-lightspeed
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: openshift-lightspeed
spec:
  llm:
    providers:
      - name: red_hat_openshift_ai
        type: rhoai_vllm
        # In-cluster KServe workload (HTTPS + self-signed CA via maas-model-ca)
        url: "https://qwen25-05b-maas-kserve-workload-svc.rhoai-deploy.svc.cluster.local:8000/v1"
        credentialsSecretRef:
          name: rhoai-api-keys
        models:
          - name: qwen25-05b
            url: "https://qwen25-05b-maas-kserve-workload-svc.rhoai-deploy.svc.cluster.local:8000/v1"
            contextWindowSize: 4096
            parameters:
              maxTokensForResponse: 1024
  ols:
    defaultProvider: red_hat_openshift_ai
    defaultModel: qwen25-05b
    logLevel: INFO
    additionalCAConfigMapRef:
      name: maas-model-ca
